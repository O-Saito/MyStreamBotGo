<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Live</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #18181b;
        }

        body {
            font-family: sans-serif;
            /*font-size: 50px;*/
        }

        .dark {
            color: white;
            background-color: var(--bg-color);
        }

        h1:has(+.box-content) {
            margin-bottom: 0px;
        }

        h1:has(+.box-options+.box-content) {
            margin-bottom: 0px;
        }

        h1:has(+.box-options) {
            display: inline-block;
        }

        .box-content {
            border: 1px solid white;
        }

        #logins .areas {
            border: 1px solid white;
            padding: 5px;
            margin-bottom: 5px;
            vertical-align: middle;
        }

        .areas>.header {
            border-bottom: 1px solid white;
            margin-bottom: 5px;
        }

        .areas .body .chat-list .list::before {
            content: "Conectado aos Chats:";
        }

        .areas .body .chat-list .list {
            margin: 0px;
            margin-top: 2px;
            margin-bottom: 2px;
            padding: 0px;
        }

        .areas .body .chat-list .list li {
            margin-left: 25px;
        }

        #logins .areas label,
        #logins .areas span {
            vertical-align: middle;
        }

        #logins .areas img {
            width: 25px;
            border: 1px solid black;
            border-radius: 15px;
            vertical-align: middle;
        }

        #events {
            border: 1px solid #ccc;
            padding: 10px;
            height: 100px;
            overflow-y: scroll;
            resize: vertical;
        }

        #events .event {
            vertical-align: middle;
            line-height: 27px;
        }

        #events .event .user {
            text-decoration: underline;
        }

        #chat {
            /*  border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            resize: vertical;*/
            margin-bottom: 10px;
        }

        #chat .content {
            padding: 10px;
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            resize: vertical;
        }

        #chat .sender {
            border: 1px solid white;
        }

        #chat .sender input {
            display: inline-block;
            width: 90%;
        }

        #chat .sender button {
            display: inline-block;
            /*width: 8%;*/
        }

        #chat .message {
            vertical-align: middle;
            line-height: 27px;
        }

        #chat .message .chat-user>img {
            width: 20px;
            vertical-align: middle;
            margin-left: 5px;
        }

        #chat .message.first-message:not(.message-deleted) {
            border: 2px solid #8400c7;
            border-radius: 5px;
            padding-top: 9px;
            margin-top: 8px;
            position: relative;
        }

        #chat .message.first-message:not(.message-deleted)::after {
            content: "Primeira Mensagem!";
            background-color: var(--bg-color);
            padding: 0 10px;
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 15px;
            font-weight: bold;
        }

        #chat .message:has(.streamer-ref) {
            font-weight: bold;
            background-color: #430000;
            border-radius: 5px;
            padding: 2px;
        }

        #chat .message .reply-message {
            margin-top: 5px;
            margin-bottom: 2px;
            padding-left: 5px;
            font-size: 13px;
            line-height: 13px;
            color: rgb(204, 204, 204);
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            overflow: hidden;
            height: 14px;
        }

        #chat .message:has(button) .reply-message {
            padding-left: 65px;
        }

        #chat .message.message-deleted {
            text-decoration: line-through;
            color: #99999a;
        }

        #chat .message .chat-badges {
            vertical-align: middle;
            line-height: 27px;
        }

        #chat .message .chat-badges>img {
            vertical-align: middle;
        }

        #chat .message .chat-source>img {
            width: 20px;
            vertical-align: middle;
        }

        #chat .message:not([data-source-room]) .chat-channel {
            display: none;
        }

        #chat .message .chat-message>img {
            vertical-align: middle;
            max-width: 25px;
        }

        #chat .message .chat-channel>img {
            vertical-align: middle;
            max-width: 25px;
            border: 1px solid black;
            border-radius: 15px;
        }

        #chat .message .chat-source:not(:empty):not(:has(>img)):before {
            content: "["
        }

        #chat .message .chat-source:not(:empty):not(:has(>img)):after {
            content: "] "
        }

        #chat .message .chat-channel:not(:empty):not(:has(>img)):before {
            content: "("
        }

        #chat .message .chat-channel:not(:empty):not(:has(>img)):after {
            content: ") "
        }

        #chat .message .chat-message:not(:empty):before {
            content: ': ';
        }

        .message {
            margin: 2px 0;
        }

        .meta {
            font-size: 0.8em;
            color: #666;
        }

        button {
            margin-left: 5px;
        }

        #dyevents .event {
            border: 1px solid white;
            margin: 5px;
        }

        #dyevents .event>h3 {
            margin-bottom: 2px;
            margin-top: 0px;
            border-bottom: 1px solid white;
            display: inline-block;
        }

        #dyevents .event>div:not(.content-body) {
            display: inline-block;
        }

        #dyevents .content-body {
            padding: 5px;
        }
    </style>
    <link rel="stylesheet" href="/fontawesome/css/font-awesome.min.css">
</head>

<body class="dark">
    <div id="logins">
        <div id="twitch" class="areas">
            <div class="header">
                <label id="login-twitch"></label>
                <span style="float: right;">Ultimo Keepalive: <label id="twitch-last-eventsub"></label></span>
            </div>
            <div class="body">
                <div id="chat-connection-twitch" class="chat-list">
                    <div class="form">
                        <button type="button" class="btn-novo-chat">Conectar a um chat Twitch</button>
                    </div>
                    <ul class="list"></ul>
                </div>
            </div>
        </div>
        <div id="kick" class="areas">
            <div class="header">
                <label id="login-kick"></label>
            </div>
            <div class="body">
                <div id="chat-connection-kick" class="chat-list">
                    <div class="form">
                        <button type="button" class="btn-novo-chat">Conectar a um chat Kick</button>
                    </div>
                    <ul class="list"></ul>
                </div>
            </div>
        </div>
        <div id="youtube" class="areas">
            <div class="header">
                <label id="login-youtube"><a href="/youtube/login" target="_blank">Logar Youtube</a></label>
            </div>
            <div class="body">
                <div id="chat-connection-youtube" class="chat-list">
                    <div class="form">
                    </div>
                    <ul class="list"></ul>
                </div>
            </div>
        </div>
    </div>
    <h1 style="display: inline-block;">Chat Live</h1>
    <span class="box-options" style=" width: calc(100% - 152px); display: inline-block;">
        <label>
            <input type="checkbox" id="chk-acompanhar-chat" checked />Acompanhar chat
        </label>
        <label>
            <input type="checkbox" id="chk-show-view-count" checked />Contador de View
        </label>
        <span class="view-count-area" style="float: right; vertical-align: middle;">
            <span>
                <img src="https://assets.twitch.tv/assets/favicon-32-e29e246c157142c94346.png" style="height: 20px;" />
                <span id="twitch-view-count"></span>
            </span>
        </span>
    </span>
    <div id="chat" class="box-content">
        <div class="content"></div>
        <div class="sender">
            <button type="button" id="btn-mandar-msg">Mandar Mensagem</button>
        </div>
    </div>
    <h1 id="events-title">Eventos <input id="collapse-events" type="checkbox" /> </h1>
    <div id="events" class="box-content"></div>

    <h1 id="dyeventstitle">DyEvents <input id="toggle-dyevents" type="checkbox" /></h1>
    <div id="dyevents" class="box-content"></div>

    <div style="display: none;">
        <h3>Stream Info</h3>
        <label>Título: </label>
        <input type="text" id="stream-title" />
        <br />
        <br />
        <label>Jogo: </label>
        <input type="text" id="stream-game" list="stream-games" />
        <datalist id="stream-games"></datalist>
        <br />
        <br />
        <button type="button">Salvar</button>
    </div>

    <!--<script src="app.js"></script> -->

    <script type="module">
        import w from './wrapper.js'

        // first chatter

        const logins = document.getElementById('logins');
        const kickConnections = document.querySelector('#chat-connection-kick');
        const twitchConnections = document.querySelector('#chat-connection-twitch');
        const youtubeConnections = document.querySelector('#chat-connection-youtube');

        const twitchLastEventsub = document.getElementById('twitch-last-eventsub');

        const txtStreamGame = document.getElementById('stream-game')
        const streamGameList = document.getElementById('stream-games')

        const chatDiv = document.querySelector("#chat .content");
        const chatAcompanhar = document.getElementById('chk-acompanhar-chat');
        const eventDiv = document.getElementById('events');

        const dyEventsDiv = document.getElementById('dyevents');
        const lblTwitchViewCount = document.getElementById("twitch-view-count");
        const chkShowViewCount = document.getElementById('chk-show-view-count');

        const toggledyevents = document.getElementById('toggle-dyevents');
        toggledyevents.onchange = function () {
            dyEventsDiv.style.display = this.checked ? 'none' : 'block';
            document.getElementById('dyeventstitle').style.fontSize = this.checked ? '14px' : '';
        }

        let twitchData = null, youtubeData = null;

        w.on('init', (data) => {
            console.log(data);
            if (data.twitch_connected_chat && data.twitch_connected_chat.length > 0) {
                for (let i = 0; i < data.twitch_connected_chat.length; i++) {
                    const c = data.twitch_connected_chat[i];
                    w.exec('twitch-chat-connection', { id: c, name: c });
                }
            }
            if (data.kick_connected_chat && data.kick_connected_chat.length > 0) {
                for (let i = 0; i < data.kick_connected_chat.length; i++) {
                    const c = data.kick_connected_chat[i];
                    w.exec('kick-chat-connection', { id: c.ID, name: c.Slug });
                }
            }
            updateTwitchConnectionDetails(data.twitch);
            updateYouTubeConnectionDetails(data.youtube);
            updateKickConnectionDetails(data.kick.connected_as);

            loadDyModules(data.custom_events_modules);

            w.send("get-streamer-data", {});
        });

        w.on('twitch-connection', updateTwitchConnectionDetails);
        w.on('youtube-connection', updateYouTubeConnectionDetails);
        w.on('kick-connection', updateKickConnectionDetails);
        w.on('twitch-chat-connection', function (data) {
            const li = document.createElement('li');
            li.innerHTML = `(${data.id}) ${data.name}`;
            twitchConnections.querySelector('.list').append(li);
        });
        w.on('kick-chat-connection', function (data) {
            const li = document.createElement('li');
            li.innerHTML = `(${data.id}) ${data.name}`;
            kickConnections.querySelector('.list').append(li);
        });
        w.on("user-message", function (msg) {
            console.log("Nova mensagem de usuário:", msg);
            let div = document.createElement("div");
            div.className = "message";
            div.dataset.userId = msg.userId;
            div.dataset.channel = msg.channel;
            div.dataset.messageId = msg.messageId;
            div.dataset.user = msg.user;
            div.dataset.source = msg.source;

            let span = document.createElement("span");

            let source = document.createElement("span");
            let channel = document.createElement("span");
            let badges = document.createElement('span');
            let user = document.createElement('span');
            let message = document.createElement('span');

            source.className = "chat-source";
            channel.className = "chat-channel";
            badges.className = "chat-badges";
            user.className = "chat-user";
            message.className = "chat-message";

            span.append(source, channel, badges, user, message);

            source.textContent = msg.source;
            channel.textContent = msg.channel;
            user.textContent = msg.user;

            if (msg.source == "twitch") {
                message.innerHTML = checkuserReference(parseText(msg));
            } else {
                message.innerHTML = parseText(msg);
            }

            if (msg.source == "twitch") {
                source.innerHTML = `<img src="https://assets.twitch.tv/assets/favicon-32-e29e246c157142c94346.png" alt="twitch" title="twitch" />`;
            } else if (msg.source == "kick") {
                source.innerHTML = `<img src="https://kick.com/favicon.ico" alt="kick" title="kick" />`;
            } else if (msg.source == "youtube") {
                source.innerHTML = `<img src="https://www.youtube.com/s/desktop/d0c6b06b/img/favicon.ico" alt="YouTube" title="YouTube" />`;
            }

            if (msg.metadata) {
                user.style.color = msg.metadata.color;

                if (msg.metadata['first-msg'] && msg.metadata['first-msg'] == '1') {
                    div.classList.add('first-message');
                }

                if (msg.metadata['display-name'])
                    user.textContent = msg.metadata['display-name']
                if (msg.metadata['authorDetails'])
                    user.innerHTML = `<img src="${msg.metadata['authorDetails']['profileImageUrl']}" /> ${msg.user}`;
                if (msg.metadata['badges-info'])
                    badges.innerHTML = Object.getOwnPropertyNames(msg.metadata['badges-info']).map(x =>
                        msg.metadata['badges-info'][x] && msg.metadata['badges-info'][x][0] != null && msg.metadata['badges-info'][x][0] != '' ?
                            `<img src="${msg.metadata['badges-info'][x][0].image_url_1x}" alt="${msg.metadata['badges-info'][x][0].title}" title="${msg.metadata['badges-info'][x][0].title}" />` :
                            '').join('');

                if (msg.metadata['room']) {
                    channel.innerHTML = `<img src="${msg.metadata['room'].profile_image_url}" alt="${msg.metadata['room'].display_name}" title="${msg.metadata['room'].display_name}" />`;
                }
                if (msg.metadata['source-room']) {
                    channel.innerHTML = `<img src="${msg.metadata['source-room'].profile_image_url}" alt="${msg.metadata['source-room'].display_name}" title="${msg.metadata['source-room'].display_name}" />`;
                }

                if (msg.metadata["source-room-id"])
                    div.dataset.sourceRoom = msg.metadata["source-room-id"];

                if (msg.metadata['reply-parent-msg-body']) {
                    let userref = `@${msg.metadata['reply-parent-display-name']}`;
                    let text = parseMessageWithEmotes(msg.metadata['reply-parent-msg-body']);
                    message.innerHTML = message.innerHTML.replace(userref, "");
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'reply-message';
                    replyDiv.innerHTML = checkuserReference(`Respondendo a <span>${userref}</span>: ${text}`).replaceAll('\\s', '&nbsp;').replaceAll('\n', '');
                    div.prepend(replyDiv);
                }
            }
            // criar botões de ação
            if (msg.source === "twitch") {
                let delBtn = document.createElement("button");
                delBtn.title = "Deletar mensagem";
                delBtn.innerHTML = `<i class="fa fa-trash" aria-hidden="true"></i>`;
                delBtn.onclick = deleteTwitchMessage;
                let banBtn = document.createElement("button");
                banBtn.title = "Timeout de 1h";
                banBtn.innerHTML = `<i class="fa fa-ban" aria-hidden="true"></i>`;
                banBtn.onclick = banTwitchUser;

                div.appendChild(delBtn);
                div.appendChild(banBtn);
            }

            if (msg.source == "kick") {
                let delBtn = document.createElement("button");
                delBtn.textContent = "Excluir";
                delBtn.onclick = deleteKickMessage;
                //div.appendChild(delBtn);
            }

            div.appendChild(span);
            chatDiv.appendChild(div);
            if (chatAcompanhar.checked)
                chatDiv.scrollTop = chatDiv.scrollHeight;
        });
        w.on('user-message-update', function (data) {
            updateMessageDelete(data?.metadata['target-msg-id']);
        });
        w.on('user-message-delete', function (data) {
            updateMessageDelete(data);
        });
        w.on('clear-chat', function (data) {
            if (data.metadata && data.metadata['target-user-id']) {
                const msgs = chatDiv.querySelectorAll(`[data-source="twitch"][data-user-id="${data.metadata['target-user-id']}"]`);
                for (let i = 0; i < msgs.length; i++) {
                    const msg = msgs[i];
                    msg.classList.add('message-deleted');
                    msg.querySelectorAll('button').forEach(x => { x.remove(); });
                }
            }
        });
        w.on('result-query-stream-games', function (data) {
            streamGameList.innerHTML = data.map(x => `<option data-id="${x.id}" data-name="${x.name}" >${x.name}</option>`).join('');
        });
        w.on('twitch-eventsub-keepalive', function (data) {
            console.log('twitch-eventsub-keepalive', data);
            let date = new Date(data.metadata.message_timestamp);
            console.log(date);
            twitchLastEventsub.innerHTML = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
        });

        w.onTwitch("automod.message.hold", (data) => {
            const event = data.payload?.event;
            if (!event) {
                console.error("automod.message.hold without event", data);
                return;
            }

            let div = document.createElement("div");
            div.className = "message";
            div.style.color = "#99999a";

            let span = document.createElement("span");

            let source = document.createElement("span");
            let channel = document.createElement("span");
            let badges = document.createElement('span');
            let user = document.createElement('span');
            let message = document.createElement('span');

            source.className = "chat-source";
            channel.className = "chat-channel";
            badges.className = "chat-badges";
            user.className = "chat-user";
            message.className = "chat-message";

            span.append(source, channel, badges, user, message);

            source.textContent = 'twitch';
            channel.textContent = event.broadcaster_user_name;
            user.textContent = event.user_name;
            message.innerHTML = `[${event.reason} - ${event.automod?.category}] ${event.message.text}`;
            source.innerHTML = `<img src="https://assets.twitch.tv/assets/favicon-32-e29e246c157142c94346.png" title="twitch" alt="twitch" />`

            div.appendChild(span);
            chatDiv.appendChild(div);
            if (chatAcompanhar.checked)
                chatDiv.scrollTop = chatDiv.scrollHeight;

        });
        w.onTwitch("channel.follow", (data) => {
            eventDiv.innerHTML += `<div class="event"><span><span class="user">${data.payload.event.user_name}</span> seguiu ${twitchData == null || twitchData.userId == data.payload.event.broadcaster_user_id ? data.payload.event.broadcaster_user_name : 'você'}!</span></div>`;
        });
        w.onTwitch("channel.raid", (data) => {
            eventDiv.innerHTML += `<div class="event"><span><span class="user">${data.payload.event.from_broadcaster_user_name}</span> está raidando ${twitchData == null || twitchData.userId == data.payload.event.to_broadcaster_user_id ? data.payload.event.to_broadcaster_user_name : 'você'} com ${data.payload.event.viewers} viewers!</span></div>`;
        });

        w.on('result-get-streamer-data', function (data) {
            console.log('result-get-streamer-data', data);
            //if (data.id == '') return;
            lblTwitchViewCount.innerHTML = data.viewer_count.toString();
        });

        w.connect();

        // TWITCH FUNCS
        setInterval(() => {
            if (twitchData == null || twitchData == undefined) return;
            w.send("get-streamer-data", {});
        }, 1000 * 60);

        chkShowViewCount.onchange = function () {
            lblTwitchViewCount.style.color = chkShowViewCount.checked ? "" : "var(--bg-color)";
        }

        function checkuserReference(text) {
            let t1 = `@${twitchData.userLogin}`;
            let t2 = `@${twitchData.display_name}`;

            if (t1 == t2)
                return text.replaceAll(t1, `<span class="streamer-ref">${t1}</span>`);

            return text.replaceAll(t1, `<span class="streamer-ref">${t1}</span>`).replaceAll(t2, `<span class="streamer-ref">${t2}</span>`);
        }

        function connectToTwitchChat(slug) {
            w.send('connect-chat-twitch', { channel: slug });
        }

        function connectToYouTubeChat(id) {
            w.send('connect-chat-youtube', { channel: id });
        }

        function deleteTwitchMessage(e) {
            e.preventDefault();
            const messageDiv = e.target.closest('.message');
            const user = messageDiv.dataset.user;
            const message = messageDiv.dataset.messageId;

            if (!user || !message) return;

            fetch("/admin/delete/twitch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user, message })
            }).then(res => console.log("Mensagem excluída:", res.status));
        }

        function banTwitchUser(e) {
            e.preventDefault();
            const messageDiv = e.target.closest('.message');
            const userId = messageDiv.dataset.userId;

            fetch("/admin/ban/twitch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId: userId, duration: 3600 /*1h em segundos*/, reason: "" })
            }).then(res => console.log("Usuário banido:", userId));
        }

        // KICK FUNCS

        function connectToKickChat(slug) {
            fetch(`https://kick.com/api/v2/channels/${slug}`).then(x => x.json()).then(d => {
                console.log(d);
                if (d.chatroom) {
                    w.send('connect-chat-kick', { channel: slug, roomId: d.chatroom.id.toString() });
                }
            });
        }

        function deleteKickMessage(e) {
            e.preventDefault();

            //https://kick.com/api/v2/chatrooms/76514426/messages/92504d5f-a107-4c70-85bd-315eb2b88dec
            const messageDiv = e.target.parentElement;
            const user = messageDiv.dataset.user;
            const message = messageDiv.dataset.messageId;
            const channel = messageDiv.dataset.channel;

            fetch(`https://kick.com/api/v2/chatrooms/${channel.split('.')[1]}/messages/${message}`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer MTLJYZUWMZETMJAYYS0ZOWU1LTK4MJYTNGZIMGRHODK4NTK2",
                    "Content-Type": "application/json"
                }
            }).then(x => x.json()).then(d => {
                console.log(d);
            });
        }


        // VISUALS

        chatDiv.onscroll = function () {
            const atBottom = chatDiv.scrollHeight - chatDiv.scrollTop <= chatDiv.clientHeight + 20;
            if (atBottom) {
                chatAcompanhar.checked = true;
            } else {
                chatAcompanhar.checked = false;
            }
        }

        document.getElementById('collapse-events').onchange = function () {
            document.getElementById('events-title').style.fontSize = this.checked ? '14px' : '';
            eventDiv.style.display = this.checked ? 'none' : 'block';
        }

        document.getElementById('btn-mandar-msg').onclick = function (e) {
            e.preventDefault();
            const t = prompt("Informe a mensagem a ser enviada para o canal principal de todas plataformas conectadas: ");
            if (!t || t == '') return;
            w.send('send-chat-message', { text: t });
        }

        function updateMessageDelete(messageId) {
            const msg = document.querySelector(`div[data-message-id="${messageId}"]`);
            if (msg) {
                msg.classList.add('message-deleted');
                msg.querySelectorAll('button').forEach(x => { x.remove(); });
            }
        }

        function updateTwitchConnectionDetails(data) {
            twitchData = data;
            logins.querySelector('#login-twitch').innerHTML = !data || data.userLogin == '' ? `<a href="/twitch/login" target="_blank">Logar Twitch</a>` : `Twitch: <img src="${data.profile_image_url}" /> ${data.userLogin}`;
            if (!data || !data.userLogin || data.userLogin == '') {
                twitchConnections.style.display = 'none';
                return;
            }

            twitchConnections.style.display = 'block';
            twitchConnections.querySelector('.btn-novo-chat').onclick = function (e) {
                e.preventDefault();
                const t = prompt('Informe o usuário Twitch');
                if (t == '' || !t) return;
                connectToTwitchChat(t)
            }
        }

        function updateYouTubeConnectionDetails(data) {
            youtubeData = data;

            if (!data || !data.Channels || data.Channels.length == 0) {
                logins.querySelector('#login-youtube').innerHTML = `<a href="/youtube/login" target="_blank">Logar Twitch</a>`;
                youtubeConnections.style.display = 'none';
                return;
            }
            logins.querySelector('#login-youtube').innerHTML = `YouTube: ${data.Channels.map(x => `<img src="${x.thumbnail}" /> ${x.title}`).join('')}`;

            youtubeConnections.querySelector('.form').innerHTML = data.Channels.map(x => `<button type="button" data-id="${x.id}" class="btn-youtube-chat-connect">Connectar ao Chat: ${x.title}</button>`).join('');

            youtubeConnections.style.display = 'block';
            youtubeConnections.querySelector('.btn-youtube-chat-connect').onclick = function (e) {
                e.preventDefault();
                connectToYouTubeChat(e.target.dataset.id);
            }
        }

        function updateKickConnectionDetails(user) {
            logins.querySelector('#login-kick').innerHTML = user == '' ? `<a href="/kick/login" target="_blank">Logar Kick</a>` : `Kick: ${user}`;
            if (!user || user == '') {
                kickConnections.style.display = "none";
                return;
            }
            // tenta conectar ao chat da kick
            if (kickConnections.querySelectorAll('.list li').length == 0)
                connectToKickChat(user);
            kickConnections.style.display = "block";

            kickConnections.querySelector('.btn-novo-chat').onclick = function (e) {
                e.preventDefault();
                const t = prompt('Informe o usuário Kick');
                if (t == '' || !t) return;
                connectToKickChat(t);
            }
        }

        txtStreamGame.addEventListener('input', function (e) {
            console.log('input', txtStreamGame.value);
            if (txtStreamGame.value == '' || txtStreamGame.value.length < 3) {
                return;
            }
            w.send('query-stream-game', { q: txtStreamGame.value });
        });

        function parseText(data) {
            let text = parseMessageWithEmotes(data.message);

            if (data.source == "twitch" && data.metadata) {
                let emotes = data.metadata.emotes.split('/')
                if (emotes && emotes[0] != '') {
                    emotes = emotes.map(x => {
                        let v = x.split(':');
                        let id = v[0];
                        let url = `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/light/1.0`;
                        let indexes = v[1].split('-').map(y => parseInt(y));
                        let name = data.message.slice(indexes[0], indexes[1] + 1);
                        return {
                            id: id,
                            url: url,
                            name: name,
                            indexes: indexes,
                        }
                    });
                }

                for (let i = 0; i < emotes.length; i++) {
                    const emote = emotes[i];
                    text = text.replaceAll(emote.name, `<img src="${emote.url}" alt="${emote.name}" title="${emote.name}" />`)
                }

            }

            return text;
        }

        function parseMessageWithEmotes(message) {
            const emoteMap = w.getEmotes();
            return message
                .split(/\s+/)
                .map(word => {
                    const url = emoteMap[word];
                    if (url)
                        return `<img src="${url}" alt="${word}" title="${word}" class="emote">`;
                    return word;
                })
                .join(" ");
        }

        function loadDyModules(modules) {
            if (!modules || modules.length == 0) {
                document.getElementById('dyeventstitle').style.display = 'none';
                dyEventsDiv.style.display = 'none';
                return;
            }

            modules.forEach(m => {
                const div = document.createElement('div');
                div.id = m.name;
                div.classList.add('event');

                div.innerHTML = `
                <h3>${m.name}</h3>
                <div>
                    <label>${m.paused ? 'Paused' : 'Running'}</label>
                </div>
                <div class="content-body"></div>
                `;

                import(`./dyevents/${m.name}.js?t=${new Date().toISOString()}`)
                    .then(module => {
                        if (module.default) module.default();
                    })
                    .catch(error => {
                        console.error('Module loading failed:', error);
                    });

                dyEventsDiv.append(div);
            });
        }

    </script>

</body>

</html>
