<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Live</title>
    <link rel="stylesheet" href="/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <section id="twitch" class="areas login">
        <div class="header">
            <label><input type="checkbox" class="display-collapse" /></label>
            <span id="login-twitch"></span>
            <span class="stream-time"></span>
            <span class="stream-status"></span>
        </div>
        <div class="body collapse-area">
            <div class="platform-grid">
                <div class="form">
                    <div class="form-row">
                        <label for="twitch-title">Title:</label>
                        <input type="text" id="twitch-title" />
                    </div>
                    <div class="form-row">
                        <label for="twitch-game">Game:</label>
                        <input type="text" id="twitch-game" list="twitch-game-list" />
                        <datalist id="twitch-game-list"></datalist>
                    </div>
                    <div class="form-row">
                        <label for="twitch-lang">Idioma:</label>
                        <input type="text" id="twitch-lang" />
                    </div>
                    <div class="form-row">
                        <span class="form-label">Tags:</span>
                        <ul id="twitch-tags" class="inline-list"></ul>
                    </div>
                </div>
                <div id="chat-connection-twitch" class="chat-list" style="display: inline-block;">
                    <button type="button" class="btn-secondary btn-novo-chat" style="display: none;">Conectar a um
                        chat Twitch</button>
                    <ul class="list"></ul>
                </div>
            </div>
        </div>
    </section>
    <section id="kick" class="areas login">
        <div class="header">
            <label><input type="checkbox" class="display-collapse" /></label>
            <span id="login-kick"></span>
        </div>
        <div class="body collapse-area">
            <div class="platform-grid">
                <div class="form">
                    <button type="button" class="btn-secondary btn-novo-chat">Conectar a um chat Kick</button>
                </div>
                <div id="chat-connection-kick" class="chat-list">
                    <ul class="list"></ul>
                </div>
            </div>
        </div>
    </section>
    <section id="youtube" class="areas login">
        <div class="header">
            <label><input type="checkbox" class="display-collapse" /></label>
            <span id="login-youtube"><a href="/youtube/login" target="_blank">Logar Youtube</a></span>
            <span class="stream-time"></span>
            <span class="stream-status"></span>
        </div>
        <div class="body collapse-area">
            <div class="platform-grid">
                <div class="form"></div>
                <div id="chat-connection-youtube" class="chat-list">
                    <ul class="list"></ul>
                </div>
            </div>
        </div>
    </section>

    <section id="chat-section">
        <h1 style="display: inline-block;">Chat Live</h1>
        <span class="box-options" style="width: calc(100% - 152px); display: inline-block;">
            <label>
                <input type="checkbox" id="chk-acompanhar-chat" checked />Acompanhar chat
            </label>
            <label>
                <input type="checkbox" id="chk-show-view-count" checked />Contador de View
            </label>
            <span class="view-count-area" style="float: right; vertical-align: middle;">
                <span id="twitch-view-count-wrapper">
                    <img src="https://assets.twitch.tv/assets/favicon-32-e29e246c157142c94346.png"
                        style="height: 20px;" />
                    <span id="twitch-view-count">0</span>
                </span>
                <span id="youtube-view-counts-wrapper" style="margin-left: 10px;"></span>
            </span>
        </span>
        <div id="chat">
            <div class="content"></div>
            <div class="sender">
                <input type="text" id="msg-input" placeholder="Digite uma mensagem..." />
                <button type="button" id="btn-mandar-msg" class="btn-primary">Enviar</button>
            </div>
        </div>
    </section>

    <section id="events-panel" class="areas panel">
        <div class="header">
            <label><input type="checkbox" id="collapse-events" /></label>
            <span>Eventos</span>
        </div>
        <div class="body collapse-area">
            <div id="events-list"></div>
        </div>
    </section>

    <section id="dyevents-panel" class="areas panel">
        <div class="header">
            <label><input type="checkbox" id="toggle-dyevents" /></label>
            <span>Custom Events</span>
        </div>
        <div class="body collapse-area">
            <div id="dyevents-sidebar"></div>
            <div id="dyevents-list"></div>
        </div>
    </section>

    <section id="system" class="areas">
        <div class="header">
            <label><input type="checkbox" class="display-collapse" /></label>
            <span>System</span>
        </div>
        <div class="body collapse-area">
            <div class="nerd-section">
                <div><strong>Nerd:</strong></div>
                <div>Twitch Last Keepalive: <label id="twitch-last-eventsub"></label></div>
                <div>Twitch GameID: <label id="twitch-game-id"></label></div>
            </div>
            <div class="dy-statistics-overview">
                <div><strong>Dy Events:</strong></div>
                <div id="dy-statistics-list"></div>
            </div>
            <div class="ui-errors-section">
                <div><strong>UI Errors:</strong></div>
                <div id="ui-errors-list"></div>
            </div>
            <div class="state">
                <div><strong>State:</strong></div>
                <pre id="actual-current-state"></pre>
            </div>
        </div>
    </section>

    <script type="module">
        const uiErrorsList = document.getElementById('ui-errors-list');
        const errorBuffer = [];

        window.onerror = (msg, url, line, col, error) => {
            errorBuffer.push(`${new Date().toLocaleTimeString()} - ${msg} (${url}:${line})`);
            flushErrors();
            return false;
        };

        window.addEventListener('unhandledrejection', (event) => {
            errorBuffer.push(`${new Date().toLocaleTimeString()} - Unhandled Promise: ${event.reason}`);
            flushErrors();
        });

        function flushErrors() {
            if (uiErrorsList) {
                errorBuffer.forEach(err => {
                    const div = document.createElement('div');
                    div.className = 'error-entry';
                    div.textContent = err;
                    uiErrorsList.appendChild(div);
                });
                errorBuffer.length = 0;
            }
        }

        import w from './wrapper.js'
        import {
            formatDuration,
            parseTimeZone,
            getDateDiff,
            isValidLatinString,
        } from './helper.js'

        const CONSTANTS = {
            ICONS: {
                twitch: 'https://assets.twitch.tv/assets/favicon-32-e29e246c157142c94346.png',
                youtube: 'https://www.youtube.com/s/desktop/d0c6b06b/img/favicon.ico',
                kick: 'https://kick.com/favicon.ico'
            },
            EMOTE_URL: 'https://static-cdn.jtvnw.net/emoticons/v2/{id}/default/light/1.0',
            STORAGE_KEY: 'mystreambot_ui_state',
            SECTIONS: ['twitch', 'kick', 'youtube', 'system', 'events-panel', 'dyevents-panel']
        };

        const twitchDiv = document.getElementById('twitch');
        const youtubeDiv = document.getElementById('youtube');
        const kickDiv = document.getElementById('kick');

        const kickConnections = document.querySelector('#chat-connection-kick');
        const twitchConnections = document.querySelector('#chat-connection-twitch');
        const youtubeConnections = document.querySelector('#chat-connection-youtube');

        const twitchLastEventsub = document.getElementById('twitch-last-eventsub');
        const chatDiv = document.querySelector("#chat .content");
        const chatAcompanhar = document.getElementById('chk-acompanhar-chat');

        const eventDiv = document.getElementById('events-list');
        const dyEventsDiv = document.getElementById('dyevents-list');

        const chkShowViewCount = document.getElementById('chk-show-view-count');
        const lblTwitchViewCount = document.getElementById("twitch-view-count");

        const twitchGameIdLabel = document.getElementById('twitch-game-id');
        const txtStreamGame = document.getElementById('stream-game') || document.getElementById('twitch-game');
        const streamGameList = document.getElementById('stream-games') || document.getElementById('twitch-game-list');

        const chatContent = document.querySelector('#chat .content');
        const eventsList = document.getElementById('events-list');

        const twitchGameInput = document.getElementById('twitch-game');
        if (twitchGameInput) {
            twitchGameInput.addEventListener('input', (e) => {
                if (e.target.value.length >= 3) {
                    w.send('query-stream-game', { q: e.target.value });
                }
            });
        }

        const defaultState = {
            sections: {
                twitch: { collapsed: false },
                kick: { collapsed: false },
                youtube: { collapsed: false },
                system: { collapsed: false },
                'events-panel': { collapsed: false },
                'dyevents-panel': { collapsed: false }
            },
            preferences: {
                acompanharChat: true,
                showViewCount: true,
                chatHeight: 400,
                eventsHeight: 100,
                sectionOrder: ['twitch', 'youtube', 'kick', 'chat-section', 'events-panel', 'dyevents-panel', 'system']
            }
        };

        let uiState = JSON.parse(JSON.stringify(defaultState));

        function loadUIState() {
            try {
                const saved = localStorage.getItem(CONSTANTS.STORAGE_KEY);
                console.log('Loaded from localStorage:', saved);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    uiState = {
                        sections: { ...defaultState.sections, ...parsed.sections },
                        preferences: { ...defaultState.preferences, ...parsed.preferences }
                    };
                    console.log('Parsed uiState:', uiState);
                }
            } catch (e) {
                console.error('Failed to load UI state:', e);
                uiState = JSON.parse(JSON.stringify(defaultState));
            }
        }

        function saveUIState() {
            try {
                console.log('Saving to localStorage:', JSON.stringify(uiState));
                localStorage.setItem(CONSTANTS.STORAGE_KEY, JSON.stringify(uiState));
                console.log('Saved to localStorage successfully');
            } catch (e) {
                console.error('Failed to save UI state:', e);
            }
        }

        function setSectionCollapsed(id, collapsed) {
            if (uiState.sections[id] !== undefined) {
                uiState.sections[id].collapsed = collapsed;
                saveUIState();
            }
        }

        function setPreference(key, value) {
            if (uiState.preferences[key] !== undefined) {
                uiState.preferences[key] = value;
                saveUIState();
            }
        }

        function setChatHeight(height) {
            uiState.preferences.chatHeight = height;
            saveUIState();
        }

        function setEventsHeight(height) {
            uiState.preferences.eventsHeight = height;
            saveUIState();
        }

        function applyUIState() {
            Object.entries(uiState.sections).forEach(([id, data]) => {
                const el = document.getElementById(id);
                if (!el) return;
                const chk = el.querySelector('.display-collapse, #toggle-dyevents, #collapse-events');
                const area = el.querySelector('.collapse-area');
                const body = el.querySelector('.body');
                if (chk && area && body) {
                    chk.checked = !data.collapsed;
                    if (data.collapsed) {
                        area.classList.add('closed');
                        body.classList.add('collapsed');
                    } else {
                        area.classList.remove('closed');
                        body.classList.remove('collapsed');
                    }
                }
            });

            chatAcompanhar.checked = uiState.preferences.acompanharChat;
            chkShowViewCount.checked = uiState.preferences.showViewCount;
            lblTwitchViewCount.style.color = uiState.preferences.showViewCount ? "" : "var(--bg-primary)";
            chatContent.style.height = (uiState.preferences.chatHeight + 20) + 'px';
            eventsList.style.height = uiState.preferences.eventsHeight + 'px';

            applySectionOrder();
        }

        function applySectionOrder() {
            const order = uiState.preferences.sectionOrder;
            if (!order || !Array.isArray(order)) return;
            const container = document.body;
            const validIds = ['twitch', 'kick', 'youtube', 'chat-section', 'events-panel', 'dyevents-panel', 'system'];
            const orderedIds = order.filter(id => validIds.includes(id));
            orderedIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    container.appendChild(el);
                }
            });
        }

        loadUIState();
        applyUIState();

        if (!(ResizeObserver)) {
            console.error('ResizeObserver is not supported in this browser. Chat and events panels will not resize dynamically.');
        }

        if (ResizeObserver) {
            const chatResizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    setChatHeight(entry.contentRect.height);
                }
            });
            chatResizeObserver.observe(chatContent);

            const eventsResizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    setEventsHeight(entry.contentRect.height);
                }
            });
            eventsResizeObserver.observe(eventsList);
        }

        // Preference handlers
        chatAcompanhar.addEventListener('change', () => { setPreference('acompanharChat', chatAcompanhar.checked); });

        chkShowViewCount.addEventListener('change', () => {
            lblTwitchViewCount.style.color = chkShowViewCount.checked ? "" : "var(--bg-primary)";
            setPreference('showViewCount', chkShowViewCount.checked);
            updateViewCount();
        });

        // Collapse handlers
        function setupCollapseHandler(element, sectionId) {
            element.addEventListener('change', function () {
                const panel = element.closest('.areas, .panel');
                const collapseArea = panel.querySelector('.collapse-area');
                const body = panel.querySelector('.body');
                if (element.checked) {
                    collapseArea.classList.remove('closed');
                    body.classList.remove('collapsed');
                    setSectionCollapsed(sectionId, false);
                } else {
                    collapseArea.classList.add('closed');
                    body.classList.add('collapsed');
                    setSectionCollapsed(sectionId, true);
                }
            });
            element.dispatchEvent(new Event('change'));
        }

        document.querySelectorAll('.display-collapse').forEach(chk => { setupCollapseHandler(chk, chk.closest('.areas').id); });

        setupCollapseHandler(document.getElementById('toggle-dyevents'), 'dyevents-panel');
        setupCollapseHandler(document.getElementById('collapse-events'), 'events-panel');

        // Drag and Drop
        let draggedElement = null;
        let dragContainer = null;

        function isClickableElement(target) { return target.matches('input, a, button, label') || target.closest('label:has(input)'); }

        function handleDragStart(e) {
            if (isClickableElement(e.target)) return;
            const header = e.target.closest('.header, h1');
            if (!header) return;
            draggedElement = header.parentElement;
            if (!draggedElement.id) return;
            dragContainer = document.body;
            draggedElement.classList.add('dragging');
            e.preventDefault();
        }

        function handleDragMove(e) {
            if (!draggedElement) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            document.querySelectorAll('.drag-over-above, .drag-over-below').forEach(el => { el.classList.remove('drag-over-above', 'drag-over-below'); });
            const elements = Array.from(dragContainer.children).filter(el => el !== draggedElement && el.id);
            for (const el of elements) {
                const rect = el.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                if (clientY < midY) {
                    el.classList.add('drag-over-above');
                    break;
                } else if (clientY < rect.bottom) {
                    el.classList.add('drag-over-below');
                    break;
                }
            }
            if (e.touches) e.preventDefault();
        }

        function handleDragEnd(e) {
            if (!draggedElement) return;
            draggedElement.classList.remove('dragging');
            document.querySelectorAll('.drag-over-above, .drag-over-below').forEach(el => { el.classList.remove('drag-over-above', 'drag-over-below'); });
            const target = document.elementFromPoint(e.changedTouches ? e.changedTouches[0].clientX : e.clientX, e.changedTouches ? e.changedTouches[0].clientY : e.clientY);
            const targetSection = target?.closest('[id]');
            console.log('Drag end:', { targetSection: targetSection?.id, draggedElement: draggedElement.id, parentMatch: targetSection?.parentElement === dragContainer });
            if (targetSection && targetSection !== draggedElement && targetSection.parentElement === dragContainer) {
                const rect = targetSection.getBoundingClientRect();
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                const midY = rect.top + rect.height / 2;
                if (clientY < midY) {
                    dragContainer.insertBefore(draggedElement, targetSection);
                } else {
                    targetSection.after(draggedElement);
                }
                saveSectionOrder();
            }
            draggedElement = null;
            dragContainer = null;
        }

        function saveSectionOrder() {
            const sectionOrder = [];
            document.querySelectorAll('#twitch, #kick, #youtube, #chat-section, #events-panel, #dyevents-panel, #system').forEach(el => sectionOrder.push(el.id));
            console.log('Saving section order:', sectionOrder);
            uiState.preferences.sectionOrder = sectionOrder;
            saveUIState();
            console.log('UI State saved, sectionOrder:', uiState.preferences.sectionOrder);
        }

        function setupDragHandlers(container, sectionId) {
            const header = container.querySelector('.header, h1');
            if (!header) return;
            header.addEventListener('mousedown', handleDragStart);
            header.addEventListener('touchstart', handleDragStart, { passive: false });
            header.addEventListener('click', (e) => {
                if (isClickableElement(e.target)) { e.stopPropagation(); }
            });
        }

        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);

        ['twitch', 'kick', 'youtube', 'chat-section', 'events-panel', 'dyevents-panel', 'system'].forEach(id => setupDragHandlers(document.getElementById(id), id));

        chatDiv.addEventListener('scroll', () => {
            const atBottom = chatDiv.scrollHeight - chatDiv.scrollTop <= chatDiv.clientHeight + 20;
            chatAcompanhar.checked = atBottom;
        });

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                w.send('send-chat-message', { text: text });
                input.value = '';
            }
        }

        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { sendMessage(); }
        });

        document.getElementById('btn-mandar-msg').addEventListener('click', (e) => {
            e.preventDefault();
            sendMessage();
        });

        const streams = {
            // twitch data is reflection of /globals/state.go/TwitchUser
            twitch: { data: null },
            youtube: { data: null, streams: {}, offlineTimers: {}, previewStreams: {} },
            kick: { connectedAs: null }
        };

        window.streams = streams;

        w.on('init', (data) => {
            if (data.twitch_connected_chat?.length > 0) { data.twitch_connected_chat.forEach(c => w.exec('twitch-chat-connection', { id: c, name: c })); }
            if (data.kick_connected_chat?.length > 0) { data.kick_connected_chat.forEach(c => w.exec('kick-chat-connection', { id: c.ID, name: c.Slug })); }

            if (data.twitch) { streams.twitch.data = data.twitch; }
            if (data.youtube) { streams.youtube.data = data.youtube; }
            if (data.youtube_live_previews) { addYoutubeStreamPreviewData(data.youtube_live_previews); }

            updateTwitchConnectionDetails();
            updateTwitchGameData();

            updateYouTubeConnectionDetails();
            updateYouTubeStreamStatus();
            syncYouTubeChatConnections(data.youtube_connected_chat);

            updateKickConnectionDetails(data.kick?.connected_as);
            loadDyModules(data.custom_events_modules);

            getStreamerData();
            getDyStatistics();
            getCurrentState();

            if (data.interface_config) {
                try {
                    const config = JSON.parse(data.interface_config);
                    if (config.ignoreKick) { kickDiv.style.display = 'none'; }
                    if (config.ignoreYoutube) { youtubeDiv.style.display = 'none'; }
                    if (config.ignoreTwitch) { twitchDiv.style.display = 'none'; }
                } catch (e) {
                    console.error('Failed to parse interface_config:', e);
                    throw e;
                }
            }
        });

        w.on('twitch-connection', (data) => {
            streams.twitch.data = data;
            updateTwitchConnectionDetails();
            updateTwitchGameData();
        });
        w.on('youtube-connection', (data) => {
            streams.youtube.data = data;
            updateYouTubeConnectionDetails();
            updateYouTubeStreamStatus();
        });
        w.on('kick-connection', updateKickConnectionDetails);
        w.on('twitch-chat-connection', (data) => {
            const li = document.createElement('li');
            li.textContent = `(${data.id}) ${data.name}`;
            twitchConnections.querySelector('.list').appendChild(li);
        });
        w.on('kick-chat-connection', (data) => {
            const li = document.createElement('li');
            li.textContent = `(${data.id}) ${data.name}`;
            kickConnections.querySelector('.list').appendChild(li);
        });
        w.on("user-message", userMessage);
        w.on('self-message', userMessage);
        w.on('user-message-update', (data) => updateMessageDelete(data?.metadata?.['target-msg-id']));
        w.on('user-message-delete', (data) => updateMessageDelete(data?.messageId));
        w.on('clear-chat', (data) => {
            if (data?.metadata?.['target-user-id']) {
                chatDiv.querySelectorAll(`[data-source="twitch"][data-user-id="${data.metadata['target-user-id']}"]`).forEach(msg => {
                    msg.classList.add('message-deleted');
                    msg.querySelectorAll('button').forEach(b => b.remove());
                });
            }
        });

        w.on('twitch-eventsub-keepalive', (data) => {
            const date = new Date(data?.metadata?.message_timestamp);
            if (!isNaN(date)) {
                twitchLastEventsub.textContent = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
            }
        });

        w.on('youtube-live-offline', (data) => {
            const item = document.querySelector(`#chat-connection-youtube [data-live-id="${data?.liveId}"]`);
            if (item) item.classList.add('live-off');

            if (data?.liveId) {
                if (streams.youtube.streams[data.liveId]) {
                    streams.youtube.streams[data.liveId].actualEndTime = data.offlineAt || new Date().toISOString();
                }
                if (streams.youtube.offlineTimers[data.liveId]) {
                    clearTimeout(streams.youtube.offlineTimers[data.liveId]);
                }
                streams.youtube.offlineTimers[data.liveId] = setTimeout(() => {
                    delete streams.youtube.streams[data.liveId];
                    delete streams.youtube.offlineTimers[data.liveId];
                    updateViewCount();
                    updateYouTubeStreamStatus();
                }, 5 * 60 * 1000);
            }
            updateYouTubeStreamStatus();
        });

        w.onTwitch('channel.update', (data) => {
            const e = data?.payload?.event;
            if (e) {

                if (!streams.twitch.data.stream_details)
                    streams.twitch.data.stream_details = {};
                const sd = streams.twitch.data.stream_details;
                sd.title = e.title;
                sd.language = e.language;
                sd.game_id = e.category_id;
                sd.game_name = e.category_name;
                updateTwitchGameData();
            }
        });
        w.onTwitch("stream.online", (data) => {
            const e = data?.payload?.event;
            if (e) {
                if (!streams.twitch.data.stream_details)
                    streams.twitch.data.stream_details = {};
                streams.twitch.data.stream_details.started_at = e.started_at;
                updateTwitchConnectionDetails();
            }
        });
        w.onTwitch("stream.offline", () => {
            if (streams.twitch.stream_details.started_at) {
                streams.twitch.stream_details.started_at = '';
                updateTwitchConnectionDetails();
            }
        });
        w.onTwitch("automod.message.hold", (data) => {
            const event = data?.payload?.event;
            if (!event) return;

            const div = document.createElement("div");
            div.className = 'message';
            div.dataset.messageId = event.message_id;
            div.dataset.userId = event.user_id;
            div.dataset.source = 'twitch';
            div.style.color = "#99999a";

            const source = document.createElement("span");
            source.className = 'chat-source';
            source.innerHTML = `<img src="${CONSTANTS.ICONS.twitch}" alt="twitch" />`;

            const channel = document.createElement("span");
            channel.className = 'chat-channel';
            channel.textContent = event.broadcaster_user_name;

            const badges = document.createElement("span");
            badges.className = 'chat-badges';

            const user = document.createElement("span");
            user.className = 'chat-user';
            user.textContent = event.user_name;

            const message = document.createElement("span");
            message.className = 'chat-message';

            let textMessage = event.message?.text || '';
            if (event.automod?.boundaries) {
                event.automod.boundaries.forEach(x => {

        function parseText(data) {
            let text = parseMessageWithEmotes(data.message || '');

            if (data.source === "twitch" && data.metadata?.emotes) {
                let emotes = data.metadata.emotes.split('/')
                if (emotes && emotes[0] != '') {
                    emotes = emotes.map(x => {
                        let v = x.split(':');
                        let id = v[0];
                        let url = `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/light/1.0`;
                        let indexes = v[1].split('-').map(y => parseInt(y));
                        let name = data.message.slice(indexes[0], indexes[1] + 1);
                        return {
                            id: id,
                            url: url,
                            name: name,
                            indexes: indexes,
                        }
                    });
                }

                for (let i = 0; i < emotes.length; i++) {
                    const emote = emotes[i];
                    text = text.replaceAll(emote.name, `<img src="${emote.url}" />`)
                }
            }
            return text;
        }

        function parseMessageWithEmotes(message) {
            const emoteMap = w.getEmotes();
            return (message.replace(/\\s|\s/g, ' ').replace(/\n/g, '') || '')
                .split(/\s+/)
                .map(word => {
                    const url = emoteMap[word];
                    return url ? `<img src="${url}" alt="${word}" title="${word}" class="emote">` : word;
                })
                .join(" ");
        }

        function userMessage(msg) {
            const div = document.createElement("div");
            div.className = 'message';
            div.dataset.userId = msg.userId;
            div.dataset.channel = msg.channel;
            div.dataset.messageId = msg.messageId;
            div.dataset.user = msg.user;
            div.dataset.source = msg.source;

            // Build inline message structure
            const source = document.createElement("span");
            source.className = 'chat-source';

            const channel = document.createElement("span");
            channel.className = 'chat-channel';
            channel.textContent = msg.channel;

            const badges = document.createElement("span");
            badges.className = 'chat-badges';

            const user = document.createElement("span");
            user.className = 'chat-user';
            user.textContent = msg.user;

            const message = document.createElement("span");
            message.className = 'chat-message';

            // Platform icon
            const iconHtml = (platform) => `<img src="${CONSTANTS.ICONS[platform]}" alt="${platform}" />`;
            source.innerHTML = iconHtml(msg.source) || msg.source;

            // Parse message with emotes
            if (msg.source === "twitch") {
                message.innerHTML = checkuserReference(parseText(msg));
            } else {
                message.innerHTML = parseText(msg);
            }

            // Metadata handling
            if (msg.metadata) {
                user.style.color = msg.metadata.color || '';

                if (msg.metadata['first-msg'] === '1') {
                    div.classList.add('first-message');
                }

                if (msg.metadata['display-name'] && isValidLatinString(msg.metadata['display_name'])) {
                    user.textContent = msg.metadata['display-name'];
                }

                if (msg.metadata['authorDetails']) {
                    user.innerHTML = `<img src="${msg.metadata['authorDetails'].profileImageUrl}" /> ${msg.user}`;
                }

                if (msg.metadata['badges-info']) {
                    badges.innerHTML = Object.entries(msg.metadata['badges-info']).map(([key, info]) => {
                        if (info?.[0]?.image_url_1x) {
                            return `<img src="${info[0].image_url_1x}" alt="${info[0].title}" title="${info[0].title}" />`;
                        }
                        return '';
                    }).join('');
                }

                if (msg.metadata['room']?.profile_image_url) {
                    channel.innerHTML = `<img src="${msg.metadata['room'].profile_image_url}" alt="${msg.metadata['room'].display_name}" />`;
                }

                if (msg.metadata['source-room']?.profile_image_url) {
                    channel.innerHTML = `<img src="${msg.metadata['source-room'].profile_image_url}" alt="${msg.metadata['source-room'].display_name}" />`;
                }

                if (msg.metadata['source-room-id']) {
                    div.dataset.sourceRoom = msg.metadata['source-room-id'];
                }

                // Reply message
                if (msg.metadata['reply-parent-msg-body']) {
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'reply-message';
                    const parentUser = `@${msg.metadata['reply-parent-display-name'] || ''}`;
                    const parentText = parseMessageWithEmotes(msg.metadata['reply-parent-msg-body']);
                    replyDiv.innerHTML = checkuserReference(`Respondendo a <span>${parentUser}</span>: ${parentText}`);
                    div.prepend(replyDiv);
                }
            }

            // Action buttons for Twitch
            if (msg.source === "twitch") {
                const buttons = document.createElement('span');
                buttons.className = 'message-buttons-inline';

                const delBtn = document.createElement("button");
                delBtn.title = "Deletar mensagem";
                delBtn.innerHTML = '<i class="fa fa-trash"></i>';
                delBtn.onclick = deleteTwitchMessage;

                const banBtn = document.createElement("button");
                banBtn.title = "Timeout de 1h";
                banBtn.innerHTML = '<i class="fa fa-ban"></i>';
                banBtn.onclick = banTwitchUser;

                buttons.append(delBtn, banBtn);
                div.append(source, channel, badges, user, message, buttons);
            } else {
                div.append(source, channel, badges, user, message);
            }

            addChatMessage(div);
        }

            if (!modules?.length) {
                document.getElementById('dyevents-panel').style.display = 'none';
                document.getElementById('dyevents-list').style.display = 'none';
                return;
            }

            const sidebar = document.getElementById('dyevents-sidebar');
            const dyEventsDiv = document.getElementById('dyevents-list');

            modules.forEach(m => {
                const sidebarItem = document.createElement('div');
                sidebarItem.className = 'sidebar-item';
                sidebarItem.textContent = m.name;
                sidebarItem.addEventListener('click', () => selectDyEvent(m.name));
                sidebar.appendChild(sidebarItem);

                const div = document.createElement('div');
                div.id = m.name;
                div.className = 'dyevent-content';
                div.innerHTML = `
<h3>${m.name}</h3>
<div><label class="dy-stat-detail">${m.paused ? 'Paused' : 'Running'}</label></div>
<div class="content-body"></div>
`;

                import(`./customevents/${m.name}.js?t=${Date.now()}`)
                    .then(module => module.default?.({
                        addChatMessage,
                        showPanel,
                        checkuserReference,
                        parseText,
                    }))
                    .catch(err => console.error('Module loading failed:', m.name, err));

                dyEventsDiv.appendChild(div);
            });

            if (modules.length > 0) {
                selectDyEvent(modules[0].name);
            }

        function updateDyStatistics(events) {
            if (!events?.length) return;

            const overview = document.getElementById('dy-statistics-list');
            if (overview) {
                overview.innerHTML = events.map(ev => {
                    const processed = ev.processedTimes || 0;
                    const lastTime = formatDuration(ev.LastProcessedTime);
                    const interval = ev.interval ? (ev.interval / 1000000000) + 's' : 'N/A';

                    let avgTime = 'N/A';
                    if (processed > 0 && ev.ProcessedTotalTimes > 0) {
                        avgTime = formatDuration(ev.ProcessedTotalTimes / processed);
                    }
                    const hiTime = formatDuration(ev.highestTime);
                    const loTime = formatDuration(ev.lowestTime);

                    return `<div class="dy-stat-item">
                            <span>${ev.name}:</span>
                            <span>${ev.paused ? 'Paused' : 'Running'}</span>
                            <span>Int: ${interval}</span>
                            <span>Proc: ${processed}</span>
                            <span>Last: ${lastTime}</span>
                            <span>Avg: ${avgTime}</span>
                            <span>Hi: ${hiTime}</span>
                            <span>Lo: ${loTime}</span>
                        </div>`;
                }).join('');
            }

            events.forEach(ev => {
                const statLabel = document.getElementById(ev.name)?.querySelector('.dy-stat-detail');
                if (statLabel) {
                    const processed = ev.processedTimes || 0;
                    const interval = ev.interval ? (ev.interval / 1000000000) + 's' : 'N/A';
                    const lastTime = formatDuration(ev.LastProcessedTime);
                    const totalTime = ev.ProcessedTotalTimes ? Math.round(ev.ProcessedTotalTimes / 1000000) + 'ms' : '0ms';

                    let avgTime = 'N/A';
                    if (processed > 0 && ev.ProcessedTotalTimes > 0) {
                        avgTime = formatDuration(ev.ProcessedTotalTimes / processed);
                    }
                    const hiTime = formatDuration(ev.highestTime);
                    const loTime = formatDuration(ev.lowestTime);

                    statLabel.textContent = `${ev.paused ? 'Paused' : 'Running'} | Int: ${interval} | Processed: ${processed} | Last: ${lastTime} | Avg: ${avgTime} | Hi: ${hiTime} | Lo: ${loTime} | Total: ${totalTime}`;
                }
            });
        }

        function showPanel(title, content, args = {}) {
            const panel = document.createElement('div');
            panel.className = 'floating-panel';
            panel.style.cssText = `
                position: fixed;
                left: ${args?.pos?.x ?? ((window.innerWidth - 400) / 2)}px;
                top: ${args?.pos?.y ?? ((window.innerHeight - 300) / 2)}px;
                z-index: 9999;
                background: #1e1e1e;
                color: #d4d4d4;
                border: 1px solid #444;
                border-radius: 6px;
                min-width: 250px;
                max-width: 500px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            `;

            const header = document.createElement('div');
            header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #444;';

            const titleEl = document.createElement('span');
            titleEl.innerHTML = title;
            titleEl.style.cssText = 'font-weight:bold;font-size:14px;';

            const closeBtn = document.createElement('button');
            closeBtn.textContent = '×';
            closeBtn.title = 'Fechar';
            closeBtn.style.cssText = 'background:none;border:none;color:#d4d4d4;font-size:18px;cursor:pointer;padding:0 4px;line-height:1;';
            closeBtn.onclick = () => {
                args?.onClose?.();
                panel.remove();
            };

            header.appendChild(titleEl);
            header.appendChild(closeBtn);

            const body = document.createElement('div');
            body.className = 'panel-body';
            body.style.cssText = 'padding:12px;overflow:auto;max-height:60vh;';

            if (typeof content === 'string') {
                body.innerHTML = content;
            } else if (content instanceof HTMLElement) {
                body.appendChild(content);
            }

            header.style.cursor = 'move';

            panel.appendChild(header);
            panel.appendChild(body);
            document.body.appendChild(panel);

            header.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = panel.offsetLeft;
                const startTop = panel.offsetTop;

                function onMouseMove(e) {
                    panel.style.left = `${startLeft + e.clientX - startX}px`;
                    panel.style.top = `${startTop + e.clientY - startY}px`;
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            return panel;
        }

    </script>
</body>

</html>
